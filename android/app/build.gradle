plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
    id "kotlin-android"
    // El plugin de Flutter debe ir después de Android y Kotlin
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties
import java.io.FileInputStream

// Carga segura de la configuración de firma desde android/key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle("⚠️  No se encontró key.properties. El build release no podrá firmarse.")
}

android {
    namespace "com.unosoft.alertaescolar_mb"

    // Usa tus valores actuales (compatibles con Flutter)
    compileSdk 35
    ndkVersion flutter.ndkVersion

    defaultConfig {
        // Mantengo tu applicationId actual para no romper Firebase/Google Sign-In, etc.
    applicationId "com.unosoft.alertaescolar_mb"

        minSdk 23
        targetSdk 35

        // Toma versión de Flutter (pubspec.yaml)
        versionCode flutter.versionCode
        versionName flutter.versionName

        multiDexEnabled true
    }

    compileOptions {
        // Si tu JDK ya es 17 puedes subir esto a 17 sin problema.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    signingConfigs {
        // Firma de release usando key.properties
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias      keystoreProperties["keyAlias"]
                keyPassword   keystoreProperties["keyPassword"]
                storeFile     keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            } else {
                // Fallback para evitar fallos de configuración local (no recomendado para publicar)
                logger.lifecycle("⚠️  Usando firma debug por ausencia de key.properties (solo para compilar, NO para publicar).")
                initWith(debug)
            }
        }

        // (opcional) debug explícito
        debug {
            // Android Studio ya genera una debug keystore por defecto
        }
    }

    buildTypes {
        release {
            // Usa la firma de release (si no hubo key.properties, arriba hacemos fallback)
            signingConfig signingConfigs.release

            // Optimización recomendada para publicar
            minifyEnabled true
            shrinkResources true

            // R8/ProGuard
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // (opcional) Habilita crashlytics mapping si lo usas
            // firebaseCrashlytics {
            //     mappingFileUploadEnabled true
            // }
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    // (opcional) Si llegas a tener conflictos de duplicados en assets/libs, descomenta:
    // packagingOptions {
    //     resources {
    //         excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
    //     }
    // }
}

flutter {
    source = "../.."
}
